name: CI - Build & Test

on:
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Select affected checks
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.select.outputs.dotnet }}
      tool: ${{ steps.select.outputs.tool }}
      docs: ${{ steps.select.outputs.docs }}
      lint: ${{ steps.select.outputs.lint }}
      codeql: ${{ steps.select.outputs.codeql }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Analyze cumulative PR changes
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p .local/ci
          python3 scripts/ci_impact.py --json > .local/ci/impact.json
          cat .local/ci/impact.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-impact
          path: .local/ci/impact.json
          include-hidden-files: true
          if-no-files-found: error

  governance:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate CI and repository scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate C# naming
        run: bash scripts/validate-csharp-naming.sh
      - name: Validate license headers
        run: python3 scripts/license-header.py --check
      - name: Validate runtime-generator boundaries
        run: python3 scripts/validate-runtime-generator-boundaries.py
      # Secrets can be introduced in documentation as well as source code.
      - name: TruffleHog OSS
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          path: .
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

  megalinter:
    name: Source and configuration lint
    needs: impact
    if: needs.impact.outputs.lint == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: ~/.cache/megalinter
          key: ${{ runner.os }}-megalinter-v10
      - name: MegaLinter
        uses: oxsecurity/megalinter@v10.2.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAIL_ON_ERROR: ${{ github.ref == 'refs/heads/main' }}
      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles('megalinter-reports/sarif/**') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: megalinter-reports/sarif

  build-and-test:
    name: Build and Test
    needs: impact
    if: needs.impact.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ci-impact
          path: .local/ci
      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/nuget.config', '**/*.props') }}
      - name: Build affected projects
        run: python3 scripts/ci_run.py build
      - name: Pack and validate affected modules
        run: python3 scripts/ci_run.py pack
      - name: Test affected projects sequentially
        id: tests
        run: python3 scripts/ci_run.py test
      - name: Run GFramework.Godot.Tests Diagnostics
        if: always() && steps.tests.outputs.godot_failed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dotnet test GFramework.Godot.Tests/GFramework.Godot.Tests.csproj \
            -c Release --no-build --blame-crash \
            --diag TestResults/godot-testhost-diag.log \
            --logger "trx;LogFileName=godot-diagnostic.trx" \
            --results-directory TestResults \
            2>&1 | tee TestResults/godot-diagnostic.console.log
      - name: Test Report
        if: always() && steps.tests.outputs.ran_tests == 'true'
        uses: dorny/test-reporter@v3
        with:
          name: .NET Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx
      - name: Publish Test Report
        if: always() && steps.tests.outputs.ran_tests == 'true'
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './ctrf/*.json'
          github-report: true
          pull-request-report: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          summary-delta-report: true
          insights-report: true
          flaky-rate-report: true
          fail-rate-report: true
          slowest-report: true
          upload-artifact: true
          fetch-previous-results: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve test diagnostics
        if: always() && steps.tests.outputs.ran_tests == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-diagnostics
          path: TestResults/

  config-tool:
    name: Config tool tests
    needs: impact
    if: needs.impact.outputs.tool == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install and test config tool
        working-directory: tools/gframework-config-tool
        run: |
          bun install --frozen-lockfile
          bun run test

  docs:
    name: Documentation build
    needs: impact
    if: needs.impact.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build documentation without deployment
        working-directory: docs
        run: |
          bun install --frozen-lockfile
          bun run build

  codeql:
    name: CodeQL
    needs: impact
    if: needs.impact.outputs.codeql == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  required-checks:
    name: CI Result
    if: always()
    needs: [impact, governance, megalinter, build-and-test, config-tool, docs, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ci-impact
          path: .local/ci
      - name: Require every selected job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_run.py summary
