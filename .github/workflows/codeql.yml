# GitHub Actions工作流配置：CodeQL静态代码分析
# 该工作流用于对C#项目进行安全漏洞和代码质量分析
name: "CodeQL"

# 触发事件配置
# 在以下情况下触发工作流：
# PR 由主 CI 根据影响范围调用；每日和手动扫描始终覆盖完整 C# 代码。
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  # 分析任务配置
  # 对C#代码进行静态分析扫描
  analyze:
    name: Analyze (C#)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 设置.NET运行时环境
      # 配置.NET 8.0.x版本支持
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # 初始化CodeQL分析环境
      # 配置C#语言支持并启用自动构建模式
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: autobuild

      # 执行CodeQL代码分析
      # 运行静态分析并生成结果报告
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
